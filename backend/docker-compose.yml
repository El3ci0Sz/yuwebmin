version: "3.8"
services:
  db:
    image: mysql:8.0
    container_name: yuwebmin-mysql
    restart: always
    environment:
      MYSQL_DATABASE: yuwebmin_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: 123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
